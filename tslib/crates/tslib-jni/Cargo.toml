[package]
name = "tslib-jni"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Java JNI bindings for tslib"

[lib]
name = "tslib_jni"
crate-type = ["cdylib"]

[dependencies]
jni = "0.21"
# Android 平台上 hickory-resolver（DNS）与 cpal（音频）依赖 ndk-context 获取
# JVM + Application Context；须由 JNI_OnLoad 初始化（见 src/lib.rs）。
ndk-context = "0.1"
serde_json.workspace = true
tslib-core = { path = "../tslib-core" }
tslib-audio = { path = "../tslib-audio" }
tslib-chat = { path = "../tslib-chat" }
tslib-channel = { path = "../tslib-channel" }
tokio = { workspace = true, features = ["rt-multi-thread"] }
openssl = { version = "0.10", features = ["vendored"], optional = true }
log = "0.4"
android_logger = "0.14"
tracing-log = "0.2"

[features]
default = []
vendored-openssl = ["openssl"]
