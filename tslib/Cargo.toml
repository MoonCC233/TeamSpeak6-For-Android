[workspace]
resolver = "2"
members = [
    "crates/tslib-core",
    "crates/tslib-audio",
    "crates/tslib-chat",
    "crates/tslib-channel",
    "crates/tslib-ffi",
    "crates/tslib-python",
    "crates/tslib-jni",
    "crates/tslib-bot",
    "examples/simple-bot",
    "examples/voice-client",
    "examples/test-suite",
    "examples/send-msg",
]

# vendor 的第三方依赖树不属于本 workspace（避免其 dev-dependencies 参与依赖解析，
# 例如 tsclientlib 的 dev-dep cpal 0.18 → jni 0.22 → jni-sys ^0.4.1 与
# tslib-jni 的 jni 0.21 → jni-sys ^0.3 冲突）。
exclude = ["vendor/tsclientlib"]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Flamme"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/flamme/tslib"
description = "A modular TeamSpeak 3 client library"
rust-version = "1.75"

[workspace.dependencies]
# Core dependencies
tokio = { version = "1.36", features = ["full"] }
async-trait = "0.1"
futures = "0.3"
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# TeamSpeak protocol (tsclientlib)
# TS6-ANDROID-PATCH: 改用 vendor 本地副本（上游 ee3bc6f4 + 未知通知透传补丁），
# 详见 tslib/vendor/tsclientlib/VENDOR-INFO.md 与 docs/A2-screen-share-protocol.md §7.1。
tsclientlib = { path = "vendor/tsclientlib/tsclientlib" }
tsproto = { path = "vendor/tsclientlib/tsproto" }
tsproto-packets = { path = "vendor/tsclientlib/utils/tsproto-packets" }
tsproto-types = { path = "vendor/tsclientlib/utils/tsproto-types" }

# Audio
opus = "0.3"
cpal = "0.15"
rubato = "0.14"  # Resampling

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# FFI
cbindgen = "0.26"

# Crypto
rand = "0.8"
base64 = "0.21"

[workspace.lints.rust]
unsafe_code = "warn"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[profile.release]
lto = true
codegen-units = 1
strip = true
