[package]
name = "screen-share-probe"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "screen-share-probe"
path = "src/main.rs"

[dependencies]
tslib-core = { path = "../../crates/tslib-core" }

tokio = { version = "1.36", features = ["full"] }
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde_json = "1.0"
