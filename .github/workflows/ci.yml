name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    name: Android client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug
        run: ./gradlew :mobile:app:assembleDebug --stacktrace

      - name: Unit tests
        run: ./gradlew :mobile:app:testDebugUnitTest --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: teamspeak9-mobile-debug
          path: mobile/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload unit test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-unit-test-report
          path: mobile/app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

  signaling:
    name: Signaling protocol
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The desktop companion requires ../../server/signaling, so both packages
      # need their dependencies installed before either suite can run.
      - name: Install signaling deps
        working-directory: server/signaling
        run: npm install --no-audit --no-fund

      # --omit=dev skips electron: the shell binary is ~100MB and the smoke test
      # exercises `shell.js` directly rather than launching a window.
      - name: Install companion deps
        working-directory: desktop/companion
        run: npm install --no-audit --no-fund --omit=dev

      - name: Signaling tests
        working-directory: server/signaling
        run: npm test

      - name: Companion smoke test
        working-directory: desktop/companion
        run: npm test
